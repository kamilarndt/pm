name: pm
version: 1.0.0
description: "PM Agent — 113 skills (all pm-* prefixed) + 3 cron blueprints + ResearchOS. From discovery to strategy, execution, launch, growth, shipping, and multi-source research."
hermes_requires: ">=0.12.0"
author: "Kamil Arndt (PM Skills based on phuryn/pm-skills by Paweł Huryn)"
license: "MIT"
homepage: "https://github.com/kamilarndt/pm"
env_requires:
  - name: OPENAI_API_KEY
    description: "API key for the default LLM provider"
    required: true
distribution_owned:
  - distribution.yaml
  - SOUL.md
  - .hermes.md
  - config.yaml
  - README.md
  - LICENSE
  - CHANGELOG.md
  - skills/
  - cron/
