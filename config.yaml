_config_version: 32

model:
  default: openrouter/anthropic/claude-sonnet-4
  provider: openrouter
  api_mode: chat_completions
fallback_providers:
  - provider: openrouter
    model: openrouter/google/gemini-2.5-flash-preview

toolsets:
  - terminal
  - file
  - web
  - search
  - skills
  - memory
  - delegation

agent:
  max_turns: 150
  disabled_toolsets:
    - computer_use
    - browser
    - image_gen
    - video_gen
    - tts
    - vision
    - x_search
    - discord_admin
    - homeassistant
    - spotify

terminal:
  backend: local
  cwd: /root
  timeout: 180
  persistent_shell: true

web:
  backend: firecrawl
  extract_backend: firecrawl

auxiliary:
  vision:
    provider: openrouter
    model: openrouter/qwen/qwen3-vl-30b-a3b-instruct
  compression:
    provider: openrouter
    model: openrouter/google/gemini-2.0-flash-001

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  provider: mem0

security:
  redact_secrets: true

approvals:
  mode: auto
  auto: true

delegation:
  max_iterations: 50
  child_timeout_seconds: 3600
  max_concurrent_children: 3
  max_spawn_depth: 1
  subagent_auto_approve: true

hooks:
  on_session_start:
    - command: echo "[PM Agent] Loaded. PM skills + ResearchOS ready."
      timeout: 5
