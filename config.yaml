_config_version: 32

model:
  default: auto/best-coding
  provider: custom:omniroute
  api_mode: chat_completions
fallback_providers:
  - provider: custom:omniroute
    model: auto/best-fast
  - provider: custom:omniroute
    model: auto/cheap

toolsets:
  - terminal
  - file
  - web
  - search
  - skills
  - memory
  - delegation

agent:
  max_turns: 150
  disabled_toolsets:
    - computer_use
    - browser
    - image_gen
    - video_gen
    - tts
    - vision
    - x_search
    - discord_admin
    - homeassistant
    - spotify

terminal:
  backend: local
  cwd: /root
  timeout: 180
  persistent_shell: true

web:
  backend: firecrawl
  extract_backend: firecrawl

auxiliary:
  vision:
    provider: custom:omniroute
    model: openrouter/qwen/qwen3-vl-30b-a3b-instruct
    base_url: http://localhost:20128/v1
  compression:
    provider: openrouter
    model: openrouter/google/gemini-2.0-flash-001

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  provider: mem0

security:
  redact_secrets: true

approvals:
  mode: auto
  auto: true

delegation:
  max_iterations: 50
  child_timeout_seconds: 3600
  max_concurrent_children: 3
  max_spawn_depth: 1
  subagent_auto_approve: true

hooks:
  on_session_start:
    - command: echo "[PM Agent] Loaded. PM skills + ResearchOS ready."
      timeout: 5

custom_providers:
  - name: OmniRoute
    base_url: http://localhost:20128/v1
    api_key: not-needed
    model: auto/best-coding
    discover_models: false
    models:
      # Auto-routing (OmniRoute wybiera najlepszego dostępnego)
      auto/best-coding:
        desc: 💻 Najlepszy do kodowania
      auto/best-reasoning:
        desc: 🧠 Najlepszy do rozumowania
      auto/best-fast:
        desc: ⚡ Najszybszy dostępny
      auto/best-vision:
        desc: 👁️ Najlepszy z vision
      auto/best-chat:
        desc: 💬 Najlepszy do rozmowy
      auto/best-coding-fast:
        desc: 💻⚡ Kodowanie + szybkość
      auto/pro-coding:
        desc: 💻 Pro — najwyższa jakość kodowania
      auto/pro-reasoning:
        desc: 🧠 Pro — najwyższa jakość rozumowania
      auto/pro-vision:
        desc: 👁️ Pro — najlepszy vision
      auto/cheap:
        desc: 💰 Tani, do prostych zadań
      auto/best-free:
        desc: 🆓 Darmowy
      auto/smart:
        desc: 🤖 Routing przez smart provider

      # DeepSeek (opencode-go + opencode-zen free + if)
      opencode-go/deepseek-v4-pro:
        desc: 🟠 DeepSeek V4 Pro — mocny reasoning
      opencode-go/deepseek-v4-flash:
        desc: 🟠 DeepSeek V4 Flash — szybki, codzienna praca
      if/deepseek-v3.2:
        desc: 🟠 DeepSeek V3.2 — alternatywa
      if/deepseek-r1:
        desc: 🟠 DeepSeek R1 — reasoning krok po kroku
      opencode-zen/deepseek-v4-flash-free:
        desc: 🆓 DeepSeek V4 Flash — darmowy

      # Qwen (opencode-go + if)
      opencode-go/qwen3.7-max:
        desc: 🟡 Qwen 3.7 Max — max reasoning
      opencode-go/qwen3.7-plus:
        desc: 🟡 Qwen 3.7 Plus — solidny all-rounder
      if/qwen3-max:
        desc: 🟡 Qwen3 Max — z vision
      opencode-zen/qwen3.6-plus-free:
        desc: 🆓 Qwen3.6 Plus — darmowy, z vision

      # Kimi (opencode-go)
      opencode-go/kimi-k2.7-code:
        desc: ❤️ Kimi K2.7 Code — coding specialist
      opencode-go/kimi-k2.6:
        desc: ❤️ Kimi K2.6 — najnowszy

      # GLM (opencode-go)
      opencode-go/glm-5.2:
        desc: 💜 GLM 5.2 — najnowszy Zhipu

      # Minimax (opencode-go + opencode-zen free)
      opencode-go/minimax-m3:
        desc: 🤍 MiniMax M3 — najnowszy, z vision
      opencode-zen/minimax-m2.5-free:
        desc: 🆓 MiniMax M2.5 — darmowy

      # Antigravity — Gemini
      antigravity/gemini-3.1-pro-high:
        desc: 🔵 Gemini 3.1 Pro — najlepsze reasoning Google
      antigravity/gemini-3.5-flash-high:
        desc: 🔵 Gemini 3.5 Flash — szybki Gemini

      # Groq — błyskawiczna inferencja
      groq/qwen/qwen3.6-27b:
        desc: 🟢 Groq Qwen 3.6 — bardzo szybki
      groq/meta-llama/llama-4-scout-17b-16e-instruct:
        desc: 🟢 Groq Llama 4 Scout — szybki, OSS

      # Mistral AI
      mistral/mistral-large-latest:
        desc: 🔷 Mistral Large — europejski champion reasoning
      mistral/codestral-latest:
        desc: 🔷 Codestral — coding specialist

      # NVIDIA
      nvidia/deepseek-ai/deepseek-v4-pro:
        desc: 🟩 NVIDIA DeepSeek V4 Pro — reasoning przez NVIDię
      nvidia/mistralai/mistral-large-3-675b-instruct-2512:
        desc: 🟩 NVIDIA Mistral Large 3 — 675B parametrów

      # OC (OpenCode) — free tier
      oc/deepseek-v4-flash-free:
        desc: 🆓 OC DeepSeek V4 Flash — darmowy
      oc/nemotron-3-super-free:
        desc: 🆓 OC Nemotron 3 Super — darmowy
      oc/qwen3.6-plus-free:
        desc: 🆓 OC Qwen 3.6 Plus — darmowy, z vision

      # OpenAI direct
      openai/gpt-5.5:
        desc: 🤖 GPT-5.5 — najnowszy OpenAI
      openai/o4-mini:
        desc: 🤖 o4-mini — reasoning OpenAI

      # Cerebras — szybkie OSS
      cerebras/gpt-oss-120b:
        desc: ⚡ Cerebras GPT-OSS-120B — szybki OSS
      cerebras/zai-glm-4.7:
