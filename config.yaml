model:
  default: openrouter/anthropic/claude-sonnet-4
  provider: openrouter
fallback_providers:
  - provider: openrouter
    model: openrouter/google/gemini-2.5-flash-preview
agent:
  max_turns: 150
  parallel_tool_call_guidance: true
  verify_on_stop: true
  reasoning_effort: high
terminal:
  backend: local
  cwd: /root
  timeout: 180
web:
  backend: firecrawl
  extract_backend: firecrawl
browser:
  inactivity_timeout: 120
auxiliary:
  vision:
    provider: openrouter
    model: openrouter/qwen/qwen3-vl-30b-a3b-instruct
  compression:
    provider: openrouter
    model: openrouter/google/gemini-2.0-flash-001
delegation:
  max_iterations: 50
  max_summary_chars: 16000
  max_concurrent_children: 3
  max_spawn_depth: 1
display:
  compact: false
  bell_on_complete: true
  streaming: true
  show_cost: true
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
hooks:
  on_session_start:
    - command: echo "[PM Agent] Loaded. PM skills + ResearchOS ready."
      timeout: 5
