_config_version: 32

model:
  default: auto/best-coding
  provider: custom:omniroute
  api_mode: chat_completions
fallback_providers:
  - provider: custom:omniroute
    model: auto/best-fast
  - provider: custom:omniroute
    model: auto/cheap

toolsets:
  - terminal
  - file
  - web
  - search
  - skills
  - memory
  - delegation

agent:
  max_turns: 150
  disabled_toolsets:
    - computer_use
    - browser
    - image_gen
    - video_gen
    - tts
    - vision
    - x_search
    - discord_admin
    - homeassistant
    - spotify

terminal:
  backend: local
  cwd: /root
  timeout: 180
  persistent_shell: true

web:
  backend: firecrawl
  extract_backend: firecrawl

auxiliary:
  vision:
    provider: custom:omniroute
    model: openrouter/qwen/qwen3-vl-30b-a3b-instruct
    base_url: http://localhost:20128/v1
  compression:
    provider: openrouter
    model: openrouter/google/gemini-2.0-flash-001

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  provider: mem0

security:
  redact_secrets: true

approvals:
  mode: auto
  auto: true

delegation:
  max_iterations: 50
  child_timeout_seconds: 3600
  max_concurrent_children: 3
  max_spawn_depth: 1
  subagent_auto_approve: true

hooks:
  on_session_start:
    - command: echo "[PM Agent] Loaded. PM skills + ResearchOS ready."
      timeout: 5

custom_providers:
  - name: OmniRoute
    base_url: http://localhost:20128/v1
    api_key: not-needed
    model: auto/best-coding
    discover_models: false
    models:
      # Auto-routing (OmniRoute wybiera najlepszego dostępnego)
      auto/best-coding:
        desc: 💻 Najlepszy do kodowania
      auto/best-reasoning:
        desc: 🧠 Najlepszy do rozumowania
      auto/best-fast:
        desc: ⚡ Najszybszy dostępny
      auto/best-vision:
        desc: 👁️ Najlepszy z vision
      auto/best-chat:
        desc: 💬 Najlepszy do rozmowy
      auto/best-coding-fast:
        desc: 💻⚡ Kodowanie + szybkość
      auto/pro-coding:
        desc: 💻 Pro — najwyższa jakość kodowania
      auto/pro-reasoning:
        desc: 🧠 Pro — najwyższa jakość rozumowania
      auto/pro-vision:
        desc: 👁️ Pro — najlepszy vision
      auto/cheap:
        desc: 💰 Tani, do prostych zadań
      auto/best-free:
        desc: 🆓 Darmowy
      auto/smart:
        desc: 🤖 Routing przez smart provider

      # Anthropic Claude (opencode-zen)
      opencode-zen/claude-opus-4-7:
        desc: 🟣 Claude Opus 4.7 — najlepszy reasoning, strategia, deep research
      opencode-zen/claude-sonnet-4-6:
        desc: 🟣 Claude Sonnet 4.6 — najlepszy balans, PRD, execution
      opencode-zen/claude-haiku-4-5:
        desc: 🟣 Claude Haiku 4.5 — szybki, tani, daily tasks

      # OpenAI GPT (opencode-zen)
      opencode-zen/gpt-5.5:
        desc: 🟢 GPT-5.5 — najnowszy OpenAI
      opencode-zen/gpt-5.5-pro:
        desc: 🟢 GPT-5.5 Pro — pro tier
      opencode-zen/gpt-5.4:
        desc: 🟢 GPT-5.4 — solidny all-rounder

      # Google Gemini (opencode-zen)
      opencode-zen/gemini-3.1-pro:
        desc: 🔵 Gemini 3.1 Pro — reasoning, analiza
      opencode-zen/gemini-3.5-flash:
        desc: 🔵 Gemini 3.5 Flash — szybki, tani

      # DeepSeek (opencode-go + if)
      opencode-go/deepseek-v4-pro:
        desc: 🟠 DeepSeek V4 Pro — mocny reasoning
      opencode-go/deepseek-v4-flash:
        desc: 🟠 DeepSeek V4 Flash — szybki, codzienna praca
      if/deepseek-v3.2:
        desc: 🟠 DeepSeek V3.2 — alternatywa

      # Qwen (opencode-go + if)
      opencode-go/qwen3.7-max:
        desc: 🟡 Qwen 3.7 Max — max reasoning
      opencode-go/qwen3.7-plus:
        desc: 🟡 Qwen 3.7 Plus — solidny all-rounder
      if/qwen3-max:
        desc: 🟡 Qwen3 Max — z vision

      # Kimi (opencode-go)
      opencode-go/kimi-k2.7-code:
        desc: ❤️ Kimi K2.7 Code — coding specialist
      opencode-go/kimi-k2.6:
        desc: ❤️ Kimi K2.6 — najnowszy

      # GLM (opencode-go)
      opencode-go/glm-5.2:
        desc: 💜 GLM 5.2 — najnowszy Zhipu

      # Minimax (opencode-go)
      opencode-go/minimax-m3:
        desc: 🤍 MiniMax M3 — najnowszy, z vision

      # xAI Grok (opencode-zen)
      opencode-zen/grok-build-0.1:
        desc: 🤖 Grok Build 0.1 — build agent

      # Free tier
      opencode-zen/deepseek-v4-flash-free:
        desc: 🆓 DeepSeek V4 Flash — darmowy
      opencode-zen/nemotron-3-super-free:
        desc: 🆓 Nemotron 3 Super — darmowy
